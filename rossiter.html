async function upImg(f){const as=window.claude?await window.claude.use('assets'):null;if(as)return(await as.upload(f)).url;return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=URL.createObjectURL(f)})}
async function save(){st('Guardando…');try{const np=$('#np').value;if(np)S.hash=await sha(np);const css=document.querySelector('style[data-app]').textContent,js=document.getElementById('main').textContent,fl=(document.querySelector('link[href*="fonts.googleapis"]')||{outerHTML:''}).outerHTML;
const doc='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Róssiter flores y café</title><meta name="color-scheme" content="light dark">'+fl+'<style data-app>'+css+'</style></head><body><div id="app"><div id="adm"></div><div id="pub"></div></div><script id="data" type="application/json">'+JSON.stringify(S).replace(/</g,'\\u003c')+'<\/script><script id="main">'+js+'<\/script></body></html>';const a=window.claude?await window.claude.use('artifact'):null;if(a){await a.publish(doc);return}
const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));l.download='index.html';document.body.appendChild(l);l.click();l.remove();st('Listo: se descargó index.html. Súbelo a tu hosting para publicar los cambios.')}catch(e){st('No se pudo guardar.')}}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;if(k==='catsText')S.cats=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);else set(k,e.target.value);clearTimeout(tm);tm=setTimeout(pub,300)});
document.addEventListener('change',async e=>{if(e.target.dataset&&e.target.dataset.bg!=null&&e.target.files[0]){try{const r={url:await upImg(e.target.files[0])};S.bg=r.url;applyBg();adm();st('Fondo listo. Recuerda publicar.')}catch(x){st('No se pudo subir la foto.')}return}const i=e.target.dataset&&e.target.dataset.up;if(i==null||!e.target.files[0])return;try{const r={url:await upImg(e.target.files[0])};S.products[i].img=r.url;adm();pub();st('Foto subida. Recuerda publicar.')}catch(x){st('No se pudo subir la foto.')}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='cf'){const i=$('#qi'),q=i.value;i.value='';ask(q)}if(e.target.id==='lf'){(async()=>{if(await sha($('#pw').value)===S.hash){admin=true;try{sessionStorage.setItem('adm','1')}catch(x){}adm();$('#lg').innerHTML='';$('#adm').scrollIntoView()}else $('#lg').insertAdjacentHTML('beforeend','<p>Contraseña incorrecta.</p>')})()}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.go)document.getElementById(d.go).scrollIntoView({behavior:'smooth'});
else if(d.cat!=null){cat=d.cat;pub()}
else if(d.q)ask(d.q);
else if(d.add2!=null){cart[d.add2]=(cart[d.add2]||0)+1;cartUI()}
else if(d.q2){const z=d.q2.split(':');cart[z[0]]=(cart[z[0]]||0)+ +z[1];if(cart[z[0]]<=0)delete cart[z[0]];cartUI()}
else if(d.cart){if(d.cart==='clear')cart={};cOpen=d.cart==='open';cartUI();if(cOpen)$('#cartm').scrollTop=0}
else if(d.add!=null){const n=NEW[d.add];S[d.add].push(typeof n==='function'?n():{...n});adm();pub()}
else if(d.del){const p=d.del.split('.');S[p[0]].splice(+p[1],1);adm();pub()}
else if('adm' in d){$('#lg').innerHTML='<form id="lf" class="cf"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn sm" type="submit">Entrar</button></form>';$('#pw').focus()}
else if('out' in d){admin=false;try{sessionStorage.removeItem('adm')}catch(x){}adm()}
else if('rmbg' in d){S.bg='';applyBg();adm()}
else if(t.id==='sv')save()});
let cart={},cOpen=false,F={mode:'delivery',zone:0,pay:0,name:'',tel:'',addr:'',when:'',note:''};
const cnt=()=>Object.keys(cart).filter(i=>S.products[i]).reduce((a,i)=>a+cart[i],0),sub=()=>Object.keys(cart).reduce((a,i)=>a+(S.products[i]?(+S.products[i].price||0)*cart[i]:0),0),dlv=()=>F.mode==='delivery'&&S.zones[F.zone]?(+S.zones[F.zone].cost||0):0;
function cartUI(){const n=cnt(),bar=$('#cartbar'),m=$('#cartm');if(!bar||!m)return;
bar.innerHTML=n&&!cOpen?`<button class="btn" data-cart="open">🛒 ${n} ${n===1?'producto':'productos'} · ${money(sub())} · Ver pedido</button>`:'';
if(!cOpen){m.innerHTML='';m.hidden=true;return}m.hidden=false;
const it=Object.keys(cart).filter(i=>S.products[i]),z=S.zones[F.zone],pm=S.pay[F.pay],dl=F.mode==='delivery';
m.innerHTML=`<div class="sheet"><h2>Tu pedido</h2>${it.length?it.map(i=>{const p=S.products[i];return`<div class="ar row"><span>${esc(p.emoji||'')} ${esc(p.name)}<br><small>${money(p.price)}</small></span><span class="q"><button data-q2="${i}:-1" aria-label="Quitar uno">−</button> ${cart[i]} <button data-q2="${i}:1" aria-label="Agregar uno">+</button></span></div>`}).join(''):'<p>Tu pedido está vacío.</p>'}
<h3 style="margin-top:1rem">Tus datos</h3>
<label>Nombre<input data-f="name" value="${esc(F.name)}" autocomplete="name"></label>
<label>Teléfono<input data-f="tel" type="tel" value="${esc(F.tel)}" autocomplete="tel"></label>
<label>Entrega<select data-f="mode"><option value="delivery"${dl?' selected':''}>Delivery</option><option value="recojo"${dl?'':' selected'}>Recojo en tienda</option></select></label>
${dl?`<label>Zona de delivery<select data-f="zone">${S.zones.map((x,i)=>`<option value="${i}"${i==F.zone?' selected':''}>${esc(x.z)} (${money(x.cost)}, ${esc(x.time)})</option>`).join('')}</select></label><label>Dirección y referencia<textarea data-f="addr">${esc(F.addr)}</textarea></label>`:''}
<label>Fecha y hora de entrega o recojo<input data-f="when" value="${esc(F.when)}" placeholder="Ej.: sábado, 5:00 p. m."></label>
<label>Método de pago<select data-f="pay">${S.pay.map((x,i)=>`<option value="${i}"${i==F.pay?' selected':''}>${esc(x.m)}</option>`).join('')}</select></label>
<div class="box">${pm?`<b>${esc(pm.m)}:</b> ${esc(pm.d)}`:''}<br><small>Si pagas de forma digital, envía la captura de tu pago en el mismo chat de WhatsApp.</small></div>
<label>Dedicatoria o indicaciones<textarea data-f="note">${esc(F.note)}</textarea></label>
<div class="box"><div class="row"><span>Subtotal</span><b>${money(sub())}</b></div><div class="row"><span>${dl?'Delivery':'Recojo en tienda'}</span><b>${money(dlv())}</b></div><div class="row"><span>Total</span><b>${money(sub()+dlv())}</b></div></div>
<p id="ce" role="alert"></p><a id="send" class="btn big" href="#" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
<p style="text-align:center"><button class="btn sm alt" data-cart="close">Seguir comprando</button> <button class="btn sm del" data-cart="clear">Vaciar pedido</button></p></div>`}
function orderMsg(){const it=Object.keys(cart).filter(i=>S.products[i]).map(i=>{const p=S.products[i];return`• ${cart[i]} x ${p.name} — ${money(p.price*cart[i])}`}),dl=F.mode==='delivery',z=S.zones[F.zone],pm=S.pay[F.pay];
return[`Hola, quisiera hacer este pedido en ${S.biz.name}:`,...it,'',`Subtotal: ${money(sub())}`,dl?`Delivery (${z?z.z:''}): ${money(dlv())}`:'Recojo en tienda',`Total: ${money(sub()+dlv())}`,'',`Nombre: ${F.name}`,`Teléfono: ${F.tel}`,dl?`Dirección: ${F.addr}`:null,`Fecha y hora: ${F.when}`,`Pago: ${pm?pm.m:''}`,F.note?`Indicaciones: ${F.note}`:null].filter(x=>x!==null).join('\n')}
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f)F[f]=e.target.value});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&e.target.tagName==='SELECT'){F[f]=e.target.value;cartUI()}});
document.addEventListener('click',e=>{const a=e.target.closest('#send');if(!a)return;const er=!cnt()?'Agrega al menos un producto.':!F.name.trim()?'Escribe tu nombre.':!F.tel.trim()?'Escribe tu teléfono.':F.mode==='delivery'&&!F.addr.trim()?'Escribe tu dirección de entrega.':!F.when.trim()?'Indica la fecha y hora.':'';if(er){e.preventDefault();$('#ce').textContent=er;return}a.href=wa(orderMsg())});
pub();adm();
</script></body></html>
